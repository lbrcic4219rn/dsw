<div class="container">
  <div class="mt-3 mb-3 w-100" *ngIf="userService.permissions.canSearchMachine == 1">
    <h1>Search Machines</h1>
    <form (ngSubmit)="search()">
      <div class="d-flex justify-content-between align-items-center">
        <div class="mb-3">
          <label class="form-label" for="machines-name-filter">Machine Name</label>
          <input id="machines-name-filter" type="text" class="form-control" name="machineName" [(ngModel)]="machineNameFilter">
        </div>
        <div class="mb-3" role="group" aria-labelledby="machines-status-heading">
          <div class="form-label" id="machines-status-heading">Status</div>
          <div class="form-check">
            <input id="machines-status-running" class="form-check-input" type="checkbox" name="statusRunning" [(ngModel)]="statusRunning">
            <label class="form-check-label" for="machines-status-running">
              RUNNING
            </label>
          </div>
          <div class="form-check">
            <input id="machines-status-stopped" class="form-check-input" type="checkbox" name="statusStopped" [(ngModel)]="statusStopped">
            <label class="form-check-label" for="machines-status-stopped">
              STOPPED
            </label>
          </div>
        </div>
        <div class="mb-3" role="group" aria-labelledby="machines-created-heading">
          <div class="form-label" id="machines-created-heading">Created Between</div>
          <div class="d-flex flex-column">
            <input type="date" name="dateFrom" [(ngModel)]="dateFrom" class="form-control mb-2" aria-label="Created from">
            <input type="date" name="dateTo" [(ngModel)]="dateTo" class="form-control" aria-label="Created to">
          </div>
        </div>
        <div>
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </div>
    </form>
  </div>

  <div class="row">
    <div class="card mb-3 px-3 w-100" *ngFor="let m of machines">
      <div class="row g-0">
        <div class="col">
          <div class="card-body">
            <h3 class="card-title">{{m.name}}</h3>
            <p class="card-text">Status: {{m.status}}</p>
            <p class="card-text">Created at: {{m.createdAt | date }}</p>
            <button class="btn btn-danger" (click)="destroyMachine(m.id)" *ngIf="userService.permissions.canDestroyMachine == 1" [disabled]="m.status == 'RUNNING' || m.operationActive == 1">Destroy</button>
          </div>
        </div>
        <div class="col d-flex flex-column justify-content-around p-2">
          <button *ngIf="userService.permissions.canStartMachine == 1" class="btn btn-success" [disabled]="m.status == 'RUNNING' || m.operationActive == 1" (click)="startMachine(m.id)">START</button>
          <button *ngIf="userService.permissions.canStopMachine == 1" class="btn btn-danger" [disabled]="m.status == 'STOPPED' || m.operationActive == 1" (click)="stopMachine(m.id)">STOP</button>
          <button *ngIf="userService.permissions.canRestartMachine == 1" class="btn btn-warning" [disabled]="m.status == 'STOPPED' || m.operationActive == 1" (click)="restartMachine(m.id)">RESTART</button>
        </div>
        <div class="d-flex flex-column justify-content-around p-2">
          <p>Schedule Operation</p>
          <input type="datetime-local" class="form-control" aria-label="Schedule operation date and time" [ngModel]="scheduleDate | date:'yyyy-MM-ddTHH:mm'" (ngModelChange)="scheduleDate = $event">
          <button *ngIf="userService.permissions.canStartMachine == 1" class="btn btn-success" (click)="scheduleStartMachine(m.id)">SCHEDULE START</button>
          <button *ngIf="userService.permissions.canStopMachine == 1" class="btn btn-danger" (click)="scheduleStopMachine(m.id)">SCHEDULE STOP</button>
          <button *ngIf="userService.permissions.canRestartMachine == 1" class="btn btn-warning" (click)="scheduleRestartMachine(m.id)">SCHEDULE RESTART</button>
        </div>
      </div>
    </div>
  </div>
</div>
