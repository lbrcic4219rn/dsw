
<div class="container">
  <div class="row justify-content-center">
    <h3 *ngIf="userService.permissions.canUpdateUser == 0">No permission to update user</h3>
    <div *ngIf="userService.permissions.canUpdateUser == 1" class="col-8">
      <h1 class="text-center mt-5">Edit user</h1>
      <form [formGroup]="editUserForm" (ngSubmit)="handleSubmit()">
        <fieldset>
          <div class="mb-3">
            <label class="form-label mt-4" for="edit-user-name">Name</label>
            <input id="edit-user-name" type="text" class="form-control" formControlName="name" placeholder="Enter name">
          </div>
          <div class="mb-3">
            <label class="form-label mt-4" for="edit-user-surname">Surname</label>
            <input id="edit-user-surname" type="text" class="form-control" formControlName="surname" placeholder="Enter surname">
          </div>
          <div class="mb-3">
            <label class="form-label mt-4" for="edit-user-email">E-mail</label>
            <input id="edit-user-email" type="email" class="form-control" formControlName="email" placeholder="Enter email">
          </div>
          <div class="mb-3" formGroupName="permission">
            <legend class="mt-4">Permissions</legend>
            <div class="form-check">
              <input id="edit-user-can-read" class="form-check-input" type="checkbox" formControlName="canReadUser">
              <label class="form-check-label" for="edit-user-can-read">
                To read users
              </label>
            </div>
            <div class="form-check">
              <input id="edit-user-can-create" class="form-check-input" type="checkbox" formControlName="canCreateUser">
              <label class="form-check-label" for="edit-user-can-create">
                To create users
              </label>
            </div>
            <div class="form-check">
              <input id="edit-user-can-update" class="form-check-input" type="checkbox" formControlName="canUpdateUser">
              <label class="form-check-label" for="edit-user-can-update">
                To update users
              </label>
            </div>
            <div class="form-check">
              <input id="edit-user-can-delete" class="form-check-input" type="checkbox" formControlName="canDeleteUser">
              <label class="form-check-label" for="edit-user-can-delete">
                To delete users
              </label>
            </div>
          </div>
        </fieldset>
        <button type="submit" class="btn btn-primary mt-3">Submit</button>
      </form>
    </div>
  </div>
</div>
