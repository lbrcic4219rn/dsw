@if (userService.loggedIn()) {
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand" [routerLink]="['/']">User Management</a>
      <ul class="navbar-nav me-auto flex-row gap-3">
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/']" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">Home</a>
        </li>
        @if (userService.can('canCreateUser')) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/create']" routerLinkActive="active">Create User</a>
          </li>
        }
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/machines']" routerLinkActive="active">Machines</a>
        </li>
        @if (userService.can('canCreateMachine')) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/create-machine']" routerLinkActive="active">Create Machine</a>
          </li>
        }
        <li class="nav-item">
          <a class="nav-link" [routerLink]="['/logs']" routerLinkActive="active">Error Logs</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        @if (userService.session(); as session) {
          <span class="text-muted small">{{ session.email }}</span>
        }
        <button class="btn btn-sm btn-outline-secondary" (click)="logout()">Log out</button>
      </div>
    </div>
  </nav>
}
