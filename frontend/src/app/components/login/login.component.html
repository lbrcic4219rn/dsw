<div class="login-page d-flex flex-column justify-content-center">
  <h1 class="text-center display-4 mb-4">User Management</h1>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <form (ngSubmit)="handleLogin()">
              <div class="mb-3">
                <label class="form-label" for="login-email">Email</label>
                <input id="login-email" type="email" autocomplete="username"
                       class="form-control" [(ngModel)]="email" name="email"
                       [disabled]="submitting()">
              </div>
              <div class="mb-4">
                <label class="form-label" for="login-password">Password</label>
                <input id="login-password" type="password" autocomplete="current-password"
                       class="form-control" [(ngModel)]="password" name="password"
                       [disabled]="submitting()">
              </div>
              <button type="submit" class="btn btn-dark w-100" [disabled]="submitting()">
                @if (submitting()) {
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                  Signing in…
                } @else {
                  Login
                }
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
