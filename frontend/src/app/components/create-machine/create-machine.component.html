<div class="container mt-5">
  <div *ngIf="userService.permissions.canCreateMachine == 1">
    <h2>Create new machine</h2>
    <form (ngSubmit)="createMachine()">
      <div class="mb-3">
        <label class="form-label mt-4" for="create-machine-name">Machine name</label>
        <input id="create-machine-name" type="text" class="form-control" name="machineName" [(ngModel)]="machineName">
      </div>
      <button type="submit" class="btn btn-primary mt-2">Submit</button>
    </form>
  </div>

  <div *ngIf="userService.permissions.canCreateMachine == 0">
    <h2>No permission to create machine</h2>
  </div>
</div>
